name: weekly-crawl
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4
      - run: python crawler.py
      - name: save
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "weekly update" && git push)
      - name: notify
        if: hashFiles('new_items.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "식약처 새 글 $(date +%Y-%m-%d)" --body-file new_items.md
